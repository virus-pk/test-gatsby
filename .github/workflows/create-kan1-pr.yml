name: Create PR for KAN-1
on:
  push:
    branches:
      - KAN-1-fix-minimatch-redos
jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = 'KAN-1-fix-minimatch-redos';
            const base = 'master';
            const title = 'KAN-1: Resolve minimatch ReDoS via overrides';
            const body = [
              'Problem: Dependabot flagged CVE-2026-26996 (ReDoS) in minimatch.',
              'Implementation: Pin minimatch to 3.1.3 via npm overrides; add parent-targeted overrides for glob and ignore-walk.',
              'Verification: npm install, npm dedupe, npm ls minimatch shows 3.1.3 only; npm audit clears minimatch advisory.',
              'Impact: Security remediation only; Gatsby builds on macOS arm may need sharp/libvips; see README.',
              'Jira: KAN-1.'
            ].join('\\n');
            const existing = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${head}`, base
            });
            if (existing.data.length > 0) {
              core.info(`PR already exists: ${existing.data[0].html_url}`);
              return;
            }
            const pr = await github.rest.pulls.create({ owner, repo, head, base, title, body });
            core.info(`Created PR: ${pr.data.html_url}`);
